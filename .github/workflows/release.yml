name: Release

on:
  push:
    tags:
      - 'v*'

env:
  APP_NAME: Omnius

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install npm deps
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name "*.dmg" -o \
            -name "*.deb" -o \
            -name "*.AppImage" -o \
            -name "*.rpm" -o \
            -name "*.msi" -o \
            -name "*.exe" -o \
            -name "*.sig" \
          \) -exec cp {} release/ \;
          ls -lh release/

      - name: Generate latest.json for updater
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd release

          # Collect signature files
          MAC_ARM_SIG=""
          MAC_X64_SIG=""
          LINUX_SIG=""
          WINDOWS_SIG=""

          for f in *.sig; do
            case "$f" in
              *aarch64*apple*) MAC_ARM_SIG=$(cat "$f") ;;
              *x86_64*apple*|*x64*darwin*) MAC_X64_SIG=$(cat "$f") ;;
              *linux*|*AppImage*) LINUX_SIG=$(cat "$f") ;;
              *windows*|*.msi.sig|*.exe.sig) WINDOWS_SIG=$(cat "$f") ;;
            esac
          done

          RELEASE_URL="https://github.com/OmniusRepos/omnius-releases/releases/download/v${VERSION}"

          # Find actual filenames
          DMG_ARM=$(ls *aarch64*.dmg 2>/dev/null | head -1)
          DMG_X64=$(ls *x86_64*.dmg 2>/dev/null | head -1)
          APPIMAGE=$(ls *.AppImage 2>/dev/null | head -1)
          MSI=$(ls *.msi 2>/dev/null | grep -v '.sig' | head -1)

          cat > latest.json << ENDJSON
          {
            "version": "${VERSION}",
            "notes": "Release v${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MAC_ARM_SIG}",
                "url": "${RELEASE_URL}/${DMG_ARM:-Omnius.dmg}"
              },
              "darwin-x86_64": {
                "signature": "${MAC_X64_SIG}",
                "url": "${RELEASE_URL}/${DMG_X64:-Omnius.dmg}"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "${RELEASE_URL}/${APPIMAGE:-Omnius.AppImage}"
              },
              "windows-x86_64": {
                "signature": "${WINDOWS_SIG}",
                "url": "${RELEASE_URL}/${MSI:-Omnius.msi}"
              }
            }
          }
          ENDJSON

          cat latest.json

      - name: Create release on omnius-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"

          gh release create "${VERSION}" \
            --repo OmniusRepos/omnius-releases \
            --title "Omnius ${VERSION}" \
            --notes "## Omnius ${VERSION}

          ### Downloads
          | Platform | File |
          |----------|------|
          | macOS (Apple Silicon) | \`.dmg\` |
          | macOS (Intel) | \`.dmg\` |
          | Linux | \`.AppImage\` / \`.deb\` |
          | Windows | \`.msi\` |

          ---
          Built from source commit \`${GITHUB_SHA::7}\`" \
            release/*
