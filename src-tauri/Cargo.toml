[package]
name = "streamer"
version = "1.0.6"
description = "Omnius - Stream movies on Android TV"
authors = ["flakerim"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "streamer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for server API calls - use rustls for Android compatibility
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Utilities
thiserror = "2"
dirs = "5"
libc = "0.2"
base64 = "0.22"
urlencoding = "2"

# Video player (native ExoPlayer on Android) - local fork with subtitle support
tauri-plugin-videoplayer = { path = "plugins/tauri-plugin-videoplayer" }
