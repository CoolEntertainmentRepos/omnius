[package]
name = "streamer"
version = "1.0.0"
description = "Stream movies on Android TV"
authors = ["flakerim"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "streamer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for YTS API - use rustls for Android compatibility
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Torrent streaming - use rust-tls for Android compatibility
librqbit = { version = "8", default-features = false, features = ["rust-tls"] }

# HTTP server for video streaming
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

# Utilities
thiserror = "2"
portpicker = "0.1"
once_cell = "1"
hex = "0.4"
tokio-util = { version = "0.7", features = ["io"] }

